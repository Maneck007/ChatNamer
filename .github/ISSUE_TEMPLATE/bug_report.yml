name: 报告问题
description: 提供可复现的现象与环境信息
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除密钥、token、Cookie、私人对话与本机身份信息。
  - type: input
    id: environment
    attributes:
      label: 环境和版本
      description: Windows、Python / Node.js、相关客户端及本项目版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现、预期结果、实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 已脱敏的错误或截图
